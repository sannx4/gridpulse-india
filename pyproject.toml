[project]
name = "grid-india"
version = "0.1.0"
description = "Real-time Indian power-grid telemetry and intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "sqlalchemy",
    "psycopg[binary]",
    "python-dotenv",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
